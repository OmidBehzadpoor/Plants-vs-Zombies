<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Overheal Bar Sprite Sheet – 50 Frames (65x2)</title>
<style>
body { background-color:#222; color:white; font-family:sans-serif; text-align:center; padding-top:20px;}
canvas { display:block; margin:0 auto; }
button { margin-top:20px; padding:10px 20px; font-size:16px; cursor:pointer;}
</style>
</head>
<body>

<h1>Overheal Bar Sprite Sheet (50 Frames – Gold/Orange, 65x2)</h1>
<canvas id="spriteCanvas" width="3250" height="2"></canvas> <!-- 50 فریم × 65px -->
<br>
<button id="generate">Generate Overheal Sprite Sheet</button>

<script>
const frameCount = 50;
const frameWidth = 65;  // عرض هر فریم
const frameHeight = 2;  // ارتفاع جدید
const maxRadius = frameHeight/2;

const canvas = document.getElementById("spriteCanvas");
canvas.width = frameWidth * frameCount; // 65 * 50 = 3250
canvas.height = frameHeight;
const ctx = canvas.getContext("2d");

// Gradient Overheal (طلایی و نارنجی)
function getOverhealGradient(ctx, x, y, w, h){
    const grd = ctx.createLinearGradient(x, y, x + w, y);
    grd.addColorStop(0, "#FFD700"); // Gold
    grd.addColorStop(0.5, "#FFA500"); // Orange
    grd.addColorStop(1, "#FFB84D"); // Light Orange
    return grd;
}

// رسم مستطیل کرو
function drawRoundedRect(ctx, x, y, w, h, r, color){
    const radius = Math.min(r, w/2);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
    ctx.fill();
}

// Shine subtle
function drawShine(ctx, x, y, w, h, r){
    const radius = Math.min(r, w/2);
    const shineHeight = h*0.5;
    const gradient = ctx.createLinearGradient(x, y, x, y + shineHeight);
    gradient.addColorStop(0,"rgba(255,255,255,0.5)");
    gradient.addColorStop(1,"rgba(255,255,255,0)");
    drawRoundedRect(ctx, x, y, w, shineHeight, radius, gradient);
}

// رسم یک فریم Overheal
function drawOverhealFrame(ctx, offsetX, percent){
    drawRoundedRect(ctx, offsetX, 0, frameWidth, frameHeight, maxRadius, "#555"); // Background
    const grd = getOverhealGradient(ctx, offsetX, 0, frameWidth*percent, frameHeight);
    drawRoundedRect(ctx, offsetX, 0, frameWidth*percent, frameHeight, maxRadius, grd); // Gradient
    drawShine(ctx, offsetX, 0, frameWidth*percent, frameHeight, maxRadius);           // Shine
    const barWidth = frameWidth*percent;
    const radius = Math.min(maxRadius, barWidth/2);
    ctx.strokeStyle = "black";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(offsetX + radius, 0);
    ctx.lineTo(offsetX + barWidth - radius, 0);
    ctx.quadraticCurveTo(offsetX + barWidth, 0, offsetX + barWidth, radius);
    ctx.lineTo(offsetX + barWidth, frameHeight - radius);
    ctx.quadraticCurveTo(offsetX + barWidth, frameHeight, offsetX + barWidth - radius, frameHeight);
    ctx.lineTo(offsetX + radius, frameHeight);
    ctx.quadraticCurveTo(offsetX, frameHeight, offsetX, frameHeight - radius);
    ctx.lineTo(offsetX, radius);
    ctx.quadraticCurveTo(offsetX, 0, offsetX + radius, 0);
    ctx.closePath();
    ctx.stroke();
}

// تولید Sprite Sheet
document.getElementById("generate").addEventListener("click", ()=>{
    for(let i=0;i<frameCount;i++){
        const percent = (i+1)/frameCount; // 0 → خالی, 1 → پر
        drawOverhealFrame(ctx, i*frameWidth, percent);
    }
    const dataURL = canvas.toDataURL("image/png");
    const a = document.createElement("a");
    a.href = dataURL;
    a.download = "overheal_spritesheet_65x2.png";
    a.click();
    alert("Overheal Sprite Sheet generated! 0 → Full Overheal");
});
</script>

</body>
</html>
