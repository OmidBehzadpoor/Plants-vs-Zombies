<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reload Ring for Lock – 100 Frames</title>
<style>
  body {
    background:#141414;
    color:#fff;
    font-family:Arial, sans-serif;
    text-align:center;
  }
  canvas {
    margin-top:20px;
    border:1px dashed #444;
  }
  button {
    margin-top:16px;
    padding:10px 22px;
    font-size:16px;
    cursor:pointer;
  }
</style>
</head>
<body>

<h2>Reload Ring – 100 Frames (Lock Center, 58x58)</h2>

<canvas id="sheet"></canvas><br>
<button id="download">Download PNG</button>

<script>
const FRAMES = 100;
const SIZE = 58;       // Each frame 58x58
const RADIUS = 23;     // Adjust radius for 58x58
const THICKNESS = 4;   // Thin for small frame

const canvas = document.getElementById("sheet");
canvas.width = FRAMES * SIZE;
canvas.height = SIZE;
const ctx = canvas.getContext("2d");

/* ===== UTILS ===== */
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// Gradient colors: Red → Yellow → Green
function getColor(t) {
  let r, g;
  if (t < 0.5) {
    r = 255;
    g = lerp(0, 255, t * 2);
  } else {
    r = lerp(255, 0, (t - 0.5) * 2);
    g = 255;
  }
  return { r, g, b: 0 };
}
function colorToString(c, a=1) { return `rgba(${c.r|0},${c.g|0},${c.b|0},${a})`; }

/* ===== DRAW ONE FRAME ===== */
function drawFrame(progress) {
  ctx.clearRect(0, 0, SIZE, SIZE);

  const cx = SIZE / 2;
  const cy = SIZE / 2;
  const eased = easeOutCubic(progress);
  const color = getColor(1 - eased);

  // Background faint ring
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = THICKNESS;
  ctx.beginPath();
  ctx.arc(cx, cy, RADIUS, 0, Math.PI*2);
  ctx.stroke();

  // Glow effect
  ctx.shadowBlur = 7;
  ctx.shadowColor = colorToString(color, 0.9);

  // Pulse effect near empty (green)
  const pulse = eased < 0.15 ? Math.sin(eased * Math.PI * 6) * 1.3 : 0;

  // Reload arc
  const startAngle = -Math.PI/2;
  const endAngle = startAngle + Math.PI*2*eased;

  ctx.strokeStyle = colorToString(color, 1);
  ctx.lineWidth = THICKNESS + pulse;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.arc(cx, cy, RADIUS, startAngle, endAngle);
  ctx.stroke();

  // reset shadow
  ctx.shadowBlur = 0;
}

/* ===== GENERATE SPRITE SHEET ===== */
for(let i=0;i<FRAMES;i++){
  const progress = 1 - i/(FRAMES-1); // full → empty
  ctx.save();
  ctx.translate(i*SIZE, 0);
  drawFrame(progress);
  ctx.restore();
}

/* ===== DOWNLOAD ===== */
document.getElementById("download").onclick = ()=>{
  const a = document.createElement("a");
  a.download = "RingBar.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
};
</script>

</body>
</html>
